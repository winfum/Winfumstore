<!DOCTYPE html>
<html lang="fr">
<head>
<script>(function(){try{var p=location.pathname,c=p.replace(/\/index\.html$/i,'/').replace(/\.html$/i,'');if(c!==p)history.replaceState(history.state,'',c+location.search+location.hash);}catch(e){}})();</script>

<script>(function(){try{if(localStorage.getItem('winfum_theme')==='dark')document.documentElement.setAttribute('data-theme','dark');}catch(e){}})();</script>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>Espace Manager — WINFUM</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;0,700;1,500&family=Inter:wght@300;400;500;600&display=swap">
<style>
:root{--ink:#1c1a17;--bg:#f7f5f0;--gold:#a9782f;--wine:#7a1128;--deep:#1c1a17;--muted:rgba(28,26,23,.55);--line:rgba(28,26,23,.12);--glass:rgba(255,255,255,.62);--glass2:rgba(255,255,255,.88);--brd:rgba(255,255,255,.75);--ok:#2f7a4b;--warn:#b7791f;--bad:#a4262c;box-sizing:border-box}
:root[data-theme="dark"]{--ink:#f2ede4;--bg:#141210;--muted:rgba(242,237,228,.58);--line:rgba(242,237,228,.14);--glass:rgba(40,36,32,.62);--glass2:rgba(40,36,32,.9);--brd:rgba(255,255,255,.08)}
[data-theme="dark"] body{background:radial-gradient(1100px 560px at 100% -10%,rgba(169,120,47,.1),transparent),radial-gradient(900px 520px at -10% 110%,rgba(122,17,40,.1),transparent),var(--bg);background-attachment:fixed}
[data-theme="dark"] img{filter:brightness(.92)}
[data-theme="dark"] input[type=text],[data-theme="dark"] input[type=number],[data-theme="dark"] input[type=password],[data-theme="dark"] input[type=url],[data-theme="dark"] input[type=search],[data-theme="dark"] select,[data-theme="dark"] textarea,[data-theme="dark"] .urlfield{background:#221f1c;color:#f2ede4;border-color:rgba(255,255,255,.14)}
[data-theme="dark"] .ib,[data-theme="dark"] #modal,[data-theme="dark"] .chip,[data-theme="dark"] .tl .li{background:#221f1c;border-color:rgba(255,255,255,.1)}
[data-theme="dark"] #nav a{color:rgba(242,237,228,.72)}
[data-theme="dark"] .x:hover,[data-theme="dark"] .btn.ghost:hover{background:rgba(255,255,255,.08)}
[data-theme="dark"] .setup code{background:rgba(255,255,255,.08)}
[data-theme="dark"] .sw i{background:rgba(255,255,255,.16)}
[data-theme="dark"] .th,[data-theme="dark"] .cprev{background:linear-gradient(150deg,#3a3126,#4a2a30)}
[data-theme="dark"] .pill{background:rgba(255,255,255,.08)}
.theme-toggle{display:flex;align-items:center;justify-content:center;width:34px;height:34px;border-radius:50%;border:1px solid var(--line);background:transparent;color:var(--ink);cursor:pointer;flex:none;transition:.2s}
.theme-toggle:hover{border-color:var(--gold)}
.theme-toggle svg{width:15px;height:15px}
.theme-toggle .ic-moon{display:none}
[data-theme="dark"] .theme-toggle .ic-sun{display:none}
[data-theme="dark"] .theme-toggle .ic-moon{display:block}
*{margin:0;box-sizing:border-box}
html{scroll-behavior:smooth}
body{font-family:'Inter',system-ui,sans-serif;color:var(--ink);font-variant-numeric:lining-nums;min-height:100vh;background:radial-gradient(1100px 560px at 100% -10%,rgba(169,120,47,.14),transparent),radial-gradient(900px 520px at -10% 110%,rgba(122,17,40,.09),transparent),var(--bg);background-attachment:fixed}
h1,h2,h3,h4,.serif{font-family:'Cormorant Garamond',serif;font-variant-numeric:lining-nums}
a{color:inherit;text-decoration:none}
button,input,select,textarea{font-family:inherit;font-size:14px;color:var(--ink)}
[hidden]{display:none!important}
.glass{background:var(--glass);backdrop-filter:blur(18px) saturate(140%);-webkit-backdrop-filter:blur(18px) saturate(140%);border:1px solid var(--brd)}
.tag{font-size:11px;letter-spacing:.28em;text-transform:uppercase;color:var(--gold)}
.hint{font-size:12px;color:var(--muted);line-height:1.5}
@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}

/* login */
#login{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px}
.lcard{width:min(420px,100%);border-radius:28px;padding:38px 32px;box-shadow:0 30px 80px rgba(28,26,23,.14);animation:rise .7s cubic-bezier(.16,1,.3,1)}
.lcard .logo{width:64px;height:64px;margin:0 auto 14px;display:block;object-fit:contain}
.lcard h1{text-align:center;font-size:34px;font-style:italic;font-weight:600}
.lcard .sub{text-align:center;margin:6px 0 26px}
.lerr{background:rgba(164,38,44,.08);color:var(--bad);border-radius:12px;padding:10px 14px;font-size:13px;margin-bottom:14px}

/* champs */
.fld{display:flex;flex-direction:column;gap:6px}
.fld>label{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:500}
.fld label b{color:var(--wine)}
input[type=text],input[type=number],input[type=password],input[type=url],input[type=search],select,textarea{width:100%;padding:12px 14px;border:1px solid var(--line);border-radius:12px;background:#fff;outline:none;transition:.2s}
textarea{resize:vertical;line-height:1.5;min-height:84px}
input:focus,select:focus,textarea:focus{border-color:var(--gold);box-shadow:0 0 0 3px rgba(169,120,47,.16)}
.pwrap{position:relative}.pwrap button{position:absolute;right:8px;top:50%;transform:translateY(-50%);border:none;background:none;color:var(--muted);cursor:pointer;padding:6px;font-size:12px}
.sw{display:flex;align-items:center;gap:10px;cursor:pointer;font-size:14px;padding:6px 0}
.sw input{display:none}.sw i{width:42px;height:24px;border-radius:20px;background:rgba(28,26,23,.18);position:relative;transition:.25s;flex:none}
.sw i::after{content:'';position:absolute;top:3px;left:3px;width:18px;height:18px;border-radius:50%;background:#fff;transition:.25s;box-shadow:0 1px 3px rgba(0,0,0,.25)}
.sw input:checked+i{background:var(--ok)}.sw input:checked+i::after{transform:translateX(18px)}
.pv{min-height:0}.pv img{max-height:110px;border-radius:10px;border:1px solid var(--line);margin-top:4px;max-width:100%}
.urlfield{display:flex;align-items:stretch;border:1px solid var(--line);border-radius:12px;overflow:hidden;background:#fff;transition:.2s}
.urlfield:focus-within{border-color:var(--gold);box-shadow:0 0 0 3px rgba(169,120,47,.13)}
.urlfield input{flex:1;min-width:0;border:none;border-radius:0;background:transparent}
.urlfield input:focus{box-shadow:none;outline:none}
.urlfield .upl{flex:none;display:flex;align-items:center;gap:6px;padding:0 14px;border:none;border-left:1px solid var(--line);background:rgba(169,120,47,.07);color:var(--gold);cursor:pointer;font-size:11px;font-weight:700;letter-spacing:.02em;white-space:nowrap;transition:.2s}
.urlfield .upl:hover{background:rgba(169,120,47,.16)}
.urlfield .upl.busy{opacity:.55;pointer-events:none}
.urlsfield textarea{margin-bottom:8px}
.urlsfield .upl{display:inline-flex;align-items:center;gap:7px;padding:10px 16px;border-radius:30px;border:1px dashed var(--gold);background:rgba(169,120,47,.06);color:var(--gold);cursor:pointer;font-size:11.5px;font-weight:700;letter-spacing:.02em;transition:.2s}
.urlsfield .upl:hover{background:rgba(169,120,47,.15);border-style:solid}
.urlsfield .upl.busy{opacity:.55;pointer-events:none}

/* boutons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:12px 22px;border-radius:30px;border:1px solid var(--deep);background:var(--deep);color:#fff;font-size:11px;letter-spacing:.14em;text-transform:uppercase;cursor:pointer;transition:.2s;font-weight:500}
.btn:hover{background:var(--wine);border-color:var(--wine)}
.btn.ghost{background:transparent;color:var(--ink);border-color:var(--line)}.btn.ghost:hover{background:rgba(28,26,23,.05);border-color:var(--ink)}
.btn.danger{background:transparent;color:var(--bad);border-color:rgba(164,38,44,.35)}.btn.danger:hover{background:var(--bad);color:#fff;border-color:var(--bad)}
.btn.sm{padding:9px 16px;font-size:10px}.btn.full{width:100%}
.btn[disabled]{opacity:.5;pointer-events:none}
.ib{width:34px;height:34px;border-radius:50%;border:1px solid var(--line);background:#fff;display:inline-flex;align-items:center;justify-content:center;cursor:pointer;color:var(--ink);transition:.2s}
.ib:hover{border-color:var(--gold);color:var(--gold)}.ib.d:hover{border-color:var(--bad);color:var(--bad)}
.ib svg{width:15px;height:15px}

/* layout */
#app{display:flex;min-height:100vh}
#side{position:fixed;top:12px;left:12px;bottom:12px;width:256px;border-radius:26px;padding:20px 14px;display:flex;flex-direction:column;z-index:60;transition:transform .45s cubic-bezier(.16,1,.3,1)}
.sbrand{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:4px 10px 18px;font-family:'Cormorant Garamond',serif;font-size:21px;letter-spacing:.15em}
.sbrand .bl{display:flex;align-items:center;gap:10px}
.sbrand img{width:32px;height:32px;object-fit:contain}
.sbrand small{display:block;font-family:Inter;font-size:9px;letter-spacing:.24em;color:var(--gold);margin-top:2px}
#nav{flex:1;overflow-y:auto;display:flex;flex-direction:column;gap:2px}
#nav a{display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:14px;font-size:14px;font-weight:500;color:rgba(28,26,23,.75);transition:.2s}
#nav a svg{width:18px;height:18px;flex:none;color:var(--gold)}
#nav a:hover{background:rgba(169,120,47,.09)}
#nav a.on{background:var(--deep);color:#fff}#nav a.on svg{color:#e9c988}
.nsep{font-size:9px;letter-spacing:.22em;text-transform:uppercase;color:var(--muted);padding:14px 14px 6px}
.uchip{border-top:1px solid var(--line);padding:14px 8px 0;margin-top:8px}
.uchip .n{font-weight:600;font-size:14px}
.tbadge{display:inline-block;margin-left:4px;padding:3px 9px;border-radius:20px;font-size:9px;letter-spacing:.12em;text-transform:uppercase;font-weight:600;background:var(--deep);color:#e9c988;vertical-align:middle}.tbadge.a{background:linear-gradient(120deg,#a9782f,#d4af69);color:#fff}.uchip .r{font-size:11px;color:var(--gold);letter-spacing:.1em;text-transform:uppercase}
.uchip .row{display:flex;gap:8px;margin-top:10px}
.main{flex:1;margin-left:280px;padding:24px 28px 60px;min-width:0}
.topbar{display:none;align-items:center;gap:12px;margin-bottom:16px}
.burger{width:42px;height:42px;border-radius:50%;display:flex;flex-direction:column;gap:5px;align-items:center;justify-content:center;cursor:pointer;border:none}
.burger span{width:18px;height:1.5px;background:var(--ink)}
#scrim{position:fixed;inset:0;background:rgba(20,18,15,.45);backdrop-filter:blur(4px);z-index:55;opacity:0;visibility:hidden;transition:.3s}
#scrim.on{opacity:1;visibility:visible}
@media(max-width:960px){#side{transform:translateX(-120%)}#side.open{transform:none}.main{margin-left:0;padding:16px 16px 60px}.topbar{display:flex}}
#view{animation:rise .5s cubic-bezier(.16,1,.3,1)}
.pg{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap;margin-bottom:22px}
.pg h1{font-size:clamp(32px,4.5vw,44px);font-style:italic;font-weight:600;line-height:1}
.pg p{margin-top:6px}
.tools{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:16px}
.tools input[type=search]{max-width:320px;border-radius:30px;padding-left:18px}
.chips{display:flex;gap:6px}
.chip{padding:8px 15px;border-radius:30px;font-size:11px;letter-spacing:.08em;text-transform:uppercase;cursor:pointer;border:1px solid var(--line);background:#fff}
.chip.on{background:var(--deep);color:#fff;border-color:var(--deep)}

/* stats */
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:16px;margin-bottom:22px}
.stat{border-radius:22px;padding:20px 22px;animation:rise .6s cubic-bezier(.16,1,.3,1) backwards}
.stat .k{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.stat .v{font-size:34px;font-weight:600;margin-top:8px;line-height:1;letter-spacing:-.02em}
.stat .s{font-size:12px;color:var(--muted);margin-top:8px}
.stat.warn .v{color:var(--warn)}.stat.hot .v{color:var(--wine)}
.two{display:grid;grid-template-columns:1.2fr 1fr;gap:16px}
@media(max-width:1100px){.two{grid-template-columns:1fr}}
.panel{border-radius:22px;padding:20px 22px;margin-bottom:16px}
.panel h3{font-size:24px;font-style:italic;margin-bottom:12px}
.qa{display:flex;flex-wrap:wrap;gap:10px}
.li{display:flex;align-items:center;gap:12px;padding:11px 0;border-bottom:1px solid var(--line);font-size:13px}
.li:last-child{border:none}.li .g{flex:1;min-width:0}.li .g b{font-weight:600;display:block}.li .g span{color:var(--muted);font-size:12px}

/* tableau */
.tbl{border-radius:22px;overflow:hidden;background:var(--glass2);border:1px solid var(--brd);overflow-x:auto}
table{width:100%;border-collapse:collapse;min-width:640px}
th{font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);text-align:left;padding:14px 16px;border-bottom:1px solid var(--line);font-weight:500;white-space:nowrap}
td{padding:12px 16px;border-bottom:1px solid var(--line);font-size:13.5px;vertical-align:middle}
tr:last-child td{border:none}
tbody tr{transition:background .2s}tbody tr:hover{background:rgba(169,120,47,.05)}
td.act{white-space:nowrap;text-align:right}td.act .ib{margin-left:6px}
.th{width:46px;height:46px;border-radius:12px;background:linear-gradient(150deg,#e9dcc0,#f3d6da);overflow:hidden;display:flex;align-items:center;justify-content:center;color:var(--muted);font-size:11px;flex:none}
.th img{width:100%;height:100%;object-fit:cover}
.nm b{font-weight:600;display:block}.nm span{font-size:12px;color:var(--muted)}
.pill{display:inline-block;padding:4px 11px;border-radius:20px;font-size:10px;letter-spacing:.1em;text-transform:uppercase;font-weight:600;background:rgba(28,26,23,.07);color:var(--muted)}
.pill.ok{background:rgba(47,122,75,.12);color:var(--ok)}.pill.warn{background:rgba(183,121,31,.14);color:var(--warn)}.pill.bad{background:rgba(164,38,44,.1);color:var(--bad)}.pill.wine{background:rgba(122,17,40,.1);color:var(--wine)}.pill.gold{background:rgba(169,120,47,.14);color:var(--gold)}
.empty{text-align:center;padding:60px 20px;color:var(--muted)}
.empty h3{font-size:26px;font-style:italic;color:var(--ink);margin-bottom:6px}
.price{font-weight:600}

/* modal */
#mov{position:fixed;inset:0;background:rgba(20,18,15,.5);backdrop-filter:blur(8px);z-index:200;display:flex;align-items:center;justify-content:center;padding:20px;opacity:0;visibility:hidden;transition:.3s}
#mov.on{opacity:1;visibility:visible}
#modal{width:min(720px,100%);max-height:92vh;background:#fff;border-radius:26px;display:flex;flex-direction:column;transform:translateY(24px) scale(.98);transition:.4s cubic-bezier(.16,1,.3,1);box-shadow:0 40px 100px rgba(20,10,12,.35)}
#mov.on #modal{transform:none}
#modal.sm{width:min(440px,100%)}
.mh{display:flex;justify-content:space-between;align-items:center;padding:22px 26px 6px}
.mh h3{font-size:28px;font-style:italic;font-weight:600}
.x{width:34px;height:34px;border-radius:50%;display:flex;align-items:center;justify-content:center;cursor:pointer;flex:none;background:none;border:none}.x:hover{background:rgba(28,26,23,.07)}
.mb{padding:14px 26px;overflow-y:auto;flex:1}
.mf{display:flex;justify-content:flex-end;gap:10px;padding:16px 26px 22px;border-top:1px solid var(--line)}
.fg{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.fg .full{grid-column:1/-1}
@media(max-width:640px){#mov{align-items:flex-end;padding:0}#modal{border-radius:26px 26px 0 0;max-height:94vh}.fg{grid-template-columns:1fr}.mh,.mb,.mf{padding-left:18px;padding-right:18px}}
.tiers{margin-top:22px;padding-top:18px;border-top:1px dashed var(--line)}
.tiers h4{font-size:24px;font-style:italic;margin-bottom:4px}
.tl{margin:12px 0}.tl .li{padding:10px 12px;background:#faf7f1;border-radius:12px;margin-bottom:6px;border:none}
.ta{display:grid;grid-template-columns:1fr 1fr auto;gap:10px;align-items:center}
@media(max-width:520px){.ta{grid-template-columns:1fr 1fr}.ta .btn{grid-column:1/-1}}

/* contenu du site */
.cgroup{margin-bottom:20px}
.cgroup h3{font-size:26px;font-style:italic;margin-bottom:12px}
.cgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px}
.ccard{border-radius:20px;padding:16px;display:flex;flex-direction:column;gap:10px}
.cprev{height:110px;border-radius:12px;background:linear-gradient(150deg,#e9dcc0,#f3d6da);display:flex;align-items:center;justify-content:center;color:var(--muted);font-size:12px;overflow:hidden}
.cprev img{width:100%;height:100%;object-fit:cover}
.savebar{position:sticky;bottom:14px;display:flex;justify-content:flex-end;margin-top:8px;z-index:5}
.savebar .btn{box-shadow:0 12px 30px rgba(28,26,23,.25)}

#toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 28px);transform:translate(-50%,20px);background:var(--deep);color:#fff;padding:12px 22px;border-radius:30px;font-size:13px;opacity:0;pointer-events:none;transition:.3s;z-index:900;max-width:90vw;text-align:center}
#toast.on{opacity:1;transform:translate(-50%,0)}#toast.bad{background:var(--bad)}
.setup{max-width:640px;margin:10vh auto;padding:32px;border-radius:26px}
.setup code{background:rgba(28,26,23,.07);padding:2px 7px;border-radius:6px;font-size:12px}
.spin{width:22px;height:22px;border:2px solid var(--line);border-top-color:var(--gold);border-radius:50%;animation:sp .8s linear infinite;margin:50px auto}
@keyframes sp{to{transform:rotate(360deg)}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>

<div id="boot"><div class="spin"></div></div>

<div id="login" hidden>
  <form class="lcard glass" id="lform" autocomplete="on">
    <img class="logo" id="lLogo" alt="Winfum">
    <h1 class="serif">Espace Manager</h1>
    <p class="hint sub">Connexion avec l'identifiant fourni par l'administrateur</p>
    <div class="lerr" id="lerr" hidden></div>
    <div class="fld" style="margin-bottom:14px"><label>Nom d'utilisateur</label><input type="text" id="l-id" autocomplete="username" required placeholder="ex : Marie"></div>
    <div class="fld" style="margin-bottom:22px"><label>Mot de passe</label><div class="pwrap"><input type="password" id="l-pw" autocomplete="current-password" required><button type="button" data-a="eye">Voir</button></div></div>
    <button class="btn full" id="lbtn">Se connecter</button>
    <p class="hint" style="text-align:center;margin-top:18px"><a href="index.html" style="text-decoration:underline">← Retour au site</a></p>
  </form>
</div>

<div id="app" hidden>
  <aside id="side" class="glass">
    <div class="sbrand"><div class="bl"><img class="logo-img" alt=""><div>WINFUM<small>ESPACE MANAGER</small></div></div><button class="theme-toggle" onclick="toggleTheme()" aria-label="Changer de thème"><svg class="ic-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg><svg class="ic-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.8A9 9 0 1111.2 3 7 7 0 0021 12.8z"/></svg></button></div>
    <nav id="nav"></nav>
    <div class="uchip"><div class="n" id="uName"></div><div class="r" id="uRole"></div>
      <div class="row"><a class="btn ghost sm" href="index.html" target="_blank">Voir le site</a><button class="btn ghost sm" data-a="logout">Quitter</button></div></div>
  </aside>
  <div id="scrim" data-a="menu"></div>
  <div class="main">
    <div class="topbar"><button class="burger glass" data-a="menu" aria-label="Menu"><span></span><span></span><span></span></button><span class="serif" style="font-size:22px;letter-spacing:.12em">WINFUM</span><button class="theme-toggle" style="margin-left:auto" onclick="toggleTheme()" aria-label="Changer de thème"><svg class="ic-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg><svg class="ic-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.8A9 9 0 1111.2 3 7 7 0 0021 12.8z"/></svg></button></div>
    <div id="view"></div>
  </div>
</div>

<div id="mov"><div id="modal"></div></div>
<div id="toast"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
/* ============================================================

const MEDIA_BUCKET='media'; // bucket Supabase Storage (public) à créer une fois : Storage → New bucket → nom "media" → Public
async function wfUpload(input){
  const file=input.files&&input.files[0];if(!file)return;
  const wrap=input.closest('.urlfield'),label=input.closest('label'),urlInput=wrap.querySelector('input[type=text]'),pv=wrap.parentElement.querySelector('.pv');
  label.classList.add('busy');const span=label.querySelector('span'),orig=span.textContent;span.textContent='Envoi…';
  try{
    const ext=(file.name.split('.').pop()||'jpg').toLowerCase().replace(/[^a-z0-9]/g,'')||'jpg';
    const path=`${Date.now()}-${Math.random().toString(36).slice(2,8)}.${ext}`;
    const {error}=await sb.storage.from(MEDIA_BUCKET).upload(path,file,{cacheControl:'3600',upsert:false,contentType:file.type||undefined});
    if(error)throw error;
    const {data}=sb.storage.from(MEDIA_BUCKET).getPublicUrl(path);
    urlInput.value=data.publicUrl;urlInput.dispatchEvent(new Event('input',{bubbles:true}));
    if(pv)pv.innerHTML=`<img src="${esc(data.publicUrl)}" alt="" onerror="this.remove()">`;
    toast('Fichier envoyé ✓');
  }catch(e){
    toast(/bucket not found/i.test(e.message)?'Bucket de stockage « media » introuvable : créez-le dans Supabase → Storage → New bucket → nom « media » → Public.':err(e),1);
  }
  label.classList.remove('busy');span.textContent=orig;input.value='';
}
async function wfUploadMulti(input){
  const files=input.files?[...input.files]:[];if(!files.length)return;
  const wrap=input.closest('.urlsfield'),label=input.closest('label'),ta=wrap.querySelector('textarea');
  label.classList.add('busy');const span=label.querySelector('span'),orig=span.textContent;
  let done=0;const urls=[];
  for(const file of files){
    span.textContent=`Envoi ${++done}/${files.length}…`;
    try{
      const ext=(file.name.split('.').pop()||'jpg').toLowerCase().replace(/[^a-z0-9]/g,'')||'jpg';
      const path=`${Date.now()}-${Math.random().toString(36).slice(2,8)}.${ext}`;
      const {error}=await sb.storage.from(MEDIA_BUCKET).upload(path,file,{cacheControl:'3600',upsert:false,contentType:file.type||undefined});
      if(error)throw error;
      const {data}=sb.storage.from(MEDIA_BUCKET).getPublicUrl(path);
      urls.push(data.publicUrl);
    }catch(e){
      toast(/bucket not found/i.test(e.message)?'Bucket « media » introuvable : créez-le dans Supabase → Storage.':err(e),1);
    }
  }
  if(urls.length){ta.value=(ta.value.trim()?ta.value.trim()+'\n':'')+urls.join('\n');toast(urls.length+' fichier(s) envoyé(s) ✓');}
  label.classList.remove('busy');span.textContent=orig;input.value='';
}
function err(e){
  const m=(e&&e.message)||String(e);
  if(/duplicate key|unique/i.test(m))return 'Cette valeur existe déjà (slug, SKU, nom…).';
  if(/foreign key/i.test(m))return "Suppression impossible : cet élément est utilisé ailleurs. Désactivez-le plutôt.";
  if(/row-level security|permission denied/i.test(m))return "Droits insuffisants pour cette action.";
  if(/column .* does not exist|schema cache/i.test(m))return "Colonne manquante : exécutez le SQL d'ajout (winfum_vins_ajout.sql / winfum_admin_setup.sql).";
  if(/infinite recursion/i.test(m))return "Politique RLS récursive : exécutez winfum_admin_setup.sql.";
  return m;
}

function refOpts(f,dept,selfId,val){
  let cs=(cache[f.src]||[]).filter(c=>c.is_active!==false||c.id===val);
  if(dept)cs=cs.filter(c=>c.department===dept);
  if(f.root)cs=cs.filter(c=>!c.parent_id&&c.id!==selfId);
  const label=c=>{const p=cs.find(x=>x.id===c.parent_id)||(cache.categories||[]).find(x=>x.id===c.parent_id);return (p?p.name+' › ':'')+c.name;};
  return `<option value="">${esc(f.none||'— Aucune —')}</option>`+cs.map(c=>`<option value="${c.id}" ${c.id===val?'selected':''}>${esc(label(c))}</option>`).join('');
}
function fieldHTML(f,row){
  let v=row[f.k];if(v==null)v=f.def!==undefined?f.def:'';
  const dep=f.dep?` data-dep="${f.dep}"`:'',cls=`fld${f.full?' full':''}`,lab=`<label>${f.l}${f.req?' <b>*</b>':''}</label>`,hint=f.help?`<div class="hint">${f.help}</div>`:'';
  let inp='';
  if(f.t==='text')inp=`<input type="text" name="${f.k}" value="${esc(v)}" placeholder="${esc(f.ph||'')}">`;
  else if(f.t==='num')inp=`<input type="number" name="${f.k}" step="${f.step||'any'}" value="${esc(v)}">`;
  else if(f.t==='area')inp=`<textarea name="${f.k}">${esc(v)}</textarea>`;
  else if(f.t==='urls')inp=`<div class="urlsfield"><textarea name="${f.k}" placeholder="Un lien par ligne — ou utilisez le bouton ci-dessous">${esc(Array.isArray(v)?v.join('\n'):v)}</textarea><label class="upl">${svg('upload')}<span>Choisir depuis mon téléphone</span><input type="file" accept="image/*,video/*" multiple style="display:none" onchange="wfUploadMulti(this)"></label></div>`;
  else if(f.t==='url')inp=`<div class="urlfield"><input type="text" name="${f.k}" value="${esc(v)}" placeholder="Collez un lien, ou choisissez un fichier →" data-prev="1"><label class="upl">${svg('upload')}<span>Galerie</span><input type="file" accept="image/*,video/*" style="display:none" onchange="wfUpload(this)"></label></div><div class="pv">${v?`<img src="${esc(v)}" alt="" onerror="this.remove()">`:''}</div>`;
  else if(f.t==='sel'){const o=typeof f.o==='function'?f.o():f.o;inp=`<select name="${f.k}">${o.map(([a,b])=>`<option value="${esc(a)}" ${String(a)===String(v)?'selected':''}>${esc(b)}</option>`).join('')}</select>`;}
  else if(f.t==='ref')inp=`<select name="${f.k}" data-ref="1">${refOpts(f,row.department||f.dd,row.id,v)}</select>`;
  else if(f.t==='bool')return `<div class="${cls}"${dep}><label class="sw"><input type="checkbox" name="${f.k}" ${v?'checked':''}><i></i><span>${f.l}</span></label></div>`;
  return `<div class="${cls}"${dep}>${lab}${inp}${hint}</div>`;
}
function applyDeps(form){form.querySelectorAll('[data-dep]').forEach(el=>{const [k,val]=el.dataset.dep.split('=');el.hidden=!(form.elements[k]&&form.elements[k].value===val);});}
function refreshRefs(name,form,row){
  const dept=form.elements.department?form.elements.department.value:null;
  E[name].fields.filter(f=>f.t==='ref').forEach(f=>{const s=form.elements[f.k];if(!s)return;const cur=s.value;s.innerHTML=refOpts(f,dept,row.id,cur);});
}
function collect(c,form){
  const v={};
  for(const f of c.fields){
    const el=form.elements[f.k];if(!el)continue;
    if(f.dep&&el.closest('[data-dep]').hidden)continue;
    let x;
    if(f.t==='bool')x=el.checked;
    else if(f.t==='num'){x=el.value===''?null:Number(el.value);}
    else if(f.t==='urls')x=el.value.split('\n').map(s=>s.trim()).filter(Boolean);
    else if(f.t==='sel')x=el.value;
    else{x=el.value.trim();if(x===''&&!f.keep)x=null;}
    if(f.req&&(x===null||x===''||Number.isNaN(x))){toast(`Champ obligatoire : ${f.l}`,1);el.focus();return null;}
    v[f.k]=x;
  }
  return v;
}

  renderListSafe(d.e);

}
V.managers=async()=>{
  $('view').innerHTML=head('Comptes managers','Créez des accès pour votre équipe. Ils n\'ont jamais accès à cette section.',`<button class="btn" data-a="mnew">+ Nouveau manager</button>`)+'<div id="list"><div class="spin"></div></div>';
  const {data,error}=await sb.from('profiles').select('*').eq('role','manager').order('created_at',{ascending:false});
  if(error)return $('list').innerHTML=`<div class="tbl"><div class="empty"><h3 class="serif">Erreur</h3><p>${esc(err(error))}</p></div></div>`;
  cache.managers=data;
  if(!data.length)return $('list').innerHTML='<div class="tbl"><div class="empty"><h3 class="serif">Aucun manager</h3><p>Créez le premier compte pour déléguer la gestion.</p></div></div>';
  $('list').innerHTML=`<div class="tbl"><table><thead><tr><th>Nom (identifiant)</th><th>Accès</th><th>Créé le</th><th>Statut</th><th></th></tr></thead><tbody>${data.map(p=>`<tr><td><div class="nm"><b>${esc(p.full_name)}</b><span>${esc(nameEmail(p.full_name))}</span></div></td><td>${(p.scope&&p.scope.length?p.scope:['parfum','vin']).map(s=>`<span class="pill ${s==='vin'?'wine':'gold'}" style="margin-right:4px">${s}</span>`).join('')}</td><td>${fdate(p.created_at)}</td><td>${pill(p.is_active,'Actif','Désactivé')}</td><td class="act"><button class="ib" title="${p.is_active?'Désactiver':'Réactiver'}" data-a="mtog" data-id="${p.id}">${svg(p.is_active?'eye':'eyeoff')}</button><button class="ib" title="Nouveau mot de passe" data-a="mpw" data-id="${p.id}">${svg('key')}</button><button class="ib d" title="Supprimer" data-a="mdel" data-id="${p.id}">${svg('del')}</button></td></tr>`).join('')}</tbody></table></div>`;
};
const genPw=()=>{const c='abcdefghjkmnpqrstuvwxyzABCDEFGHJKLMNPQRSTUVWXYZ23456789';return Array.from(crypto.getRandomValues(new Uint32Array(10)),n=>c[n%c.length]).join('');};
A.mnew=()=>{
  modal(`<div class="mh"><h3 class="serif">Nouveau manager</h3><button class="x" data-a="close">✕</button></div><div class="mb"><form id="mf" class="fg" onsubmit="return false"><div class="fld full"><label>Nom <b>*</b></label><input type="text" name="n" placeholder="ex : Marie"><div class="hint">C'est l'identifiant de connexion du manager (l'email technique est créé automatiquement).</div></div><div class="fld full"><label>Mot de passe <b>*</b> (6 caractères min.)</label><div class="pwrap"><input type="text" name="p" value="${genPw()}"><button type="button" data-a="regen">Générer</button></div></div><div class="fld full"><label>Départements autorisés</label><div style="display:flex;gap:20px"><label class="sw"><input type="checkbox" name="s_parfum" checked><i></i><span>Parfums</span></label><label class="sw"><input type="checkbox" name="s_vin" checked><i></i><span>Vins</span></label></div><div class="hint">Restriction appliquée dans l'interface admin.</div></div></form></div><div class="mf"><button class="btn ghost" data-a="close">Annuler</button><button class="btn" data-a="mcreate">Créer le compte</button></div>`);
};
A.regen=(d,b)=>{b.parentElement.querySelector('input').value=genPw();};
A.mcreate=async(d,b)=>{
  const f=$('mf').elements,n=f.n.value.trim(),p=f.p.value;
  if(!n||!slugify(n))return toast('Nom requis',1);if(p.length<6)return toast('Mot de passe : 6 caractères minimum',1);
  const scope=[f.s_parfum.checked&&'parfum',f.s_vin.checked&&'vin'].filter(Boolean);
  if(!scope.length)return toast('Choisissez au moins un département',1);
  b.disabled=true;
  try{await fn({action:'create',full_name:n,password:p,scope});closeModal();
    modal(`<div class="mh"><h3 class="serif">Compte créé</h3></div><div class="mb"><p class="hint" style="font-size:14px;line-height:1.7">Transmettez ces accès à <b>${esc(n)}</b> :<br><br>Identifiant : <b>${esc(n)}</b><br>Mot de passe : <b>${esc(p)}</b></p></div><div class="mf"><button class="btn" data-a="close">Terminé</button></div>`,1);V.managers();}
  catch(e){toast(e.message,1);}b.disabled=false;
};
A.mtog=async d=>{const p=cache.managers.find(x=>x.id===d.id);const {error}=await sb.from('profiles').update({is_active:!p.is_active}).eq('id',d.id);if(error)return toast(err(error),1);toast(p.is_active?'Compte désactivé':'Compte réactivé');V.managers();};
A.mdel=async d=>{const p=cache.managers.find(x=>x.id===d.id);if(!await ask('Supprimer ce manager ?',`Le compte de <b>${esc(p.full_name)}</b> sera supprimé définitivement. Vous pouvez aussi simplement le désactiver.`,'Supprimer',1))return;try{await fn({action:'delete',id:d.id});toast('Compte supprimé');V.managers();}catch(e){toast(e.message,1);}};
A.mpw=d=>{
  const p=cache.managers.find(x=>x.id===d.id);
  modal(`<div class="mh"><h3 class="serif">Nouveau mot de passe</h3><button class="x" data-a="close">✕</button></div><div class="mb"><div class="fld"><label>Pour ${esc(p.full_name)}</label><div class="pwrap"><input type="text" id="npw" value="${genPw()}"><button type="button" data-a="regen">Générer</button></div></div></div><div class="mf"><button class="btn ghost" data-a="close">Annuler</button><button class="btn" data-a="mpwsave" data-id="${p.id}">Enregistrer</button></div>`,1);
};
A.mpwsave=async d=>{const pw=$('npw').value;if(pw.length<6)return toast('6 caractères minimum',1);try{await fn({action:'reset_password',id:d.id,password:pw});closeModal();toast('Mot de passe modifié');}catch(e){toast(e.message,1);}};


/* clients (comptes « Mon espace ») */
V.customers=async()=>{
  $('view').innerHTML=head('Clients','Comptes créés librement sur « Mon espace ». Vous pouvez bloquer un compte à tout moment.')+'<div id="list"><div class="spin"></div></div>';
  const [c,f,k]=await Promise.all([sb.from('customers').select('*').order('created_at',{ascending:false}),sb.from('customer_favorites').select('customer_id'),sb.from('customer_cart').select('customer_id,qty')]);
  if(c.error)return $('list').innerHTML=`<div class="tbl"><div class="empty"><h3 class="serif">Erreur</h3><p>${esc(err(c.error))} Avez-vous exécuté winfum_espace_setup.sql et winfum_compte_setup.sql ?</p></div></div>`;
  const nf={},nc={};(f.data||[]).forEach(r=>nf[r.customer_id]=(nf[r.customer_id]||0)+1);(k.data||[]).forEach(r=>nc[r.customer_id]=(nc[r.customer_id]||0)+r.qty);
  cache.customers=c.data;
  if(!c.data.length)return $('list').innerHTML='<div class="tbl"><div class="empty"><h3 class="serif">Aucun client</h3><p>Les inscriptions de « Mon espace » apparaîtront ici.</p></div></div>';
  const SP={approved:['ok','Approuvé'],pending:['warn','En attente'],blocked:['bad','Bloqué']};
  $('list').innerHTML=`<div class="tbl"><table><thead><tr><th>Client</th><th>Profil</th><th>Inscrit le</th><th>Favoris</th><th>Panier</th><th>Statut</th><th></th></tr></thead><tbody>${c.data.map(u=>`<tr><td><div class="nm"><b>@${esc(u.pseudo)}</b><span>${esc(u.full_name||'')}</span></div></td><td>${[u.gender&&cap(u.gender),u.birth_year&&(new Date().getFullYear()-u.birth_year)+' ans'].filter(Boolean).join(' · ')||'—'}</td><td>${fdate(u.created_at)}</td><td>${nf[u.id]||0}</td><td>${nc[u.id]||0} art.</td><td><span class="pill ${SP[u.status][0]}">${SP[u.status][1]}</span></td><td class="act">${u.status!=='approved'?`<button class="ib" title="Approuver" data-a="cst" data-id="${u.id}" data-s="approved">${svg('check')}</button>`:''}${u.status!=='blocked'?`<button class="ib d" title="Bloquer" data-a="cst" data-id="${u.id}" data-s="blocked">${svg('ban')}</button>`:`<button class="ib" title="Remettre en attente" data-a="cst" data-id="${u.id}" data-s="pending">${svg('eyeoff')}</button>`}</td></tr>`).join('')}</tbody></table></div>`;
};
A.cst=async d=>{const {error}=await sb.rpc('set_customer_status',{cid:d.id,s:d.s});if(error)return toast(err(error),1);toast({approved:'Compte approuvé',blocked:'Compte bloqué',pending:'Remis en attente'}[d.s]);V.customers();};

/* ---------- démarrage ---------- */
(async function boot(){
  if(!configured){
    $('boot').outerHTML=`<div class="setup glass"><h1 class="serif" style="font-size:34px;font-style:italic">Configuration requise</h1><p class="hint" style="margin:12px 0;font-size:14px;line-height:1.7">Ouvrez <code>admin.html</code> et remplacez <code>SUPABASE_URL</code> et <code>SUPABASE_KEY</code> (clé <b>publishable</b>) en haut du script. ${window.supabase?'':'<br><b>La bibliothèque Supabase n\'a pas pu se charger (connexion ?).</b>'}</p></div>`;return;
  }
  const {data:{session}}=await sb.auth.getSession();
  if(session)enter(session.user);else showLogin();
})();
</script>
